const imgs=new Set(['jpg','jpeg','png','gif','webp']),app=document.getElementById('app');function ext(f){return f.split('.').pop().toLowerCase()}function base(f){return f.split('/').pop()}function card(cat,root,f){let e=ext(f),href=root+f,img=imgs.has(e),title=`<h3 class="name ${img?'blank':''}">${img?'&nbsp;':base(f)}</h3>`,kind=img?'image':'doc';return `<article class="card ${kind}" data-cat="${cat}" data-key="${(cat+' '+f).toLowerCase()}"><a target="_blank" href="${href}"><div class="pic">${img?`<img src="${href}" alt="${base(f)}">`:`<div class="icon">${e.toUpperCase()}</div>`}<span class="badge">${e.toUpperCase()}</span></div><div class="ct">${title}<span class="pill">${cat}</span><span class="pill">${img?'图片':e.toUpperCase()}</span><span class="open">打开浏览</span></div></a></article>`}app.innerHTML=data.map(g=>`<section class="sec" data-sec="${g[0]}"><div class="head"><div><h2>${g[0]}</h2><p class="desc">${g[1]}</p></div><span class="count">${g[3].length} 个文件</span></div><div class="grid">${g[3].map(f=>card(g[0],g[2],f)).join('')}</div></section>`).join('');let filter='all',q=document.getElementById('q');function run(){let kw=q.value.trim().toLowerCase(),n=0;document.querySelectorAll('.card').forEach(c=>{let ok=(filter=='all'||c.dataset.cat==filter)&&(!kw||c.dataset.key.includes(kw));c.classList.toggle('hide',!ok);if(ok)n++});document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('hide',![...s.querySelectorAll('.card')].some(c=>!c.classList.contains('hide'))));empty.style.display=n?'none':'block'}q.oninput=run;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;run()});
